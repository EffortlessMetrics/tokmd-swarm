name: Test Action

on:
  pull_request:
    types: [labeled]
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'
  push:
    branches:
      - main
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-action-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci:qualify' && format('qualification-{0}-{1}', github.event.pull_request.number, github.sha) || format('observation-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  test-action:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 360 }}
    name: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'ci:qualify') && 'Observation - ' || '' }}Test tokmd-receipt Action
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Admit explicit PR qualification
        shell: bash
        id: qualification_gate
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ci_qualification.py

      - name: Allocate phase 2 budget
        id: phase_budget_2
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run tokmd-receipt action
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_2.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_2.outputs.minutes || '1') || 360 }}
        id: tokmd
        uses: ./
        with:
          version: 1.14.0
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 3 budget
        id: phase_budget_3
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify outputs exist
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_3.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_3.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ ! -f tokmd-summary.md ]; then
            echo "::error::tokmd-summary.md not generated"
            exit 1
          fi
          if [ ! -f tokmd-receipt.json ]; then
            echo "::error::tokmd-receipt.json not generated"
            exit 1
          fi
          if [ "${{ steps.tokmd.outputs.summary }}" != "tokmd-summary.md" ]; then
            echo "::error::summary output did not point to tokmd-summary.md"
            exit 1
          fi
          if [ "${{ steps.tokmd.outputs.receipt }}" != "tokmd-receipt.json" ]; then
            echo "::error::receipt output did not point to tokmd-receipt.json"
            exit 1
          fi
          if [ -n "${{ steps.tokmd.outputs['gate-verdict'] }}" ]; then
            echo "::error::gate-verdict output should be empty for omitted mode"
            exit 1
          fi
          if [ -n "${{ steps.tokmd.outputs['cockpit-report'] }}" ]; then
            echo "::error::cockpit-report output should be empty for omitted mode"
            exit 1
          fi
          if [ -n "${{ steps.tokmd.outputs['sensor-report'] }}" ]; then
            echo "::error::sensor-report output should be empty for omitted mode"
            exit 1
          fi
          if [ -n "${{ steps.tokmd.outputs['baseline-report'] }}" ]; then
            echo "::error::baseline-report output should be empty for omitted mode"
            exit 1
          fi
          echo "✓ Both receipt files generated successfully"
          echo "--- Summary preview ---"
          head -20 tokmd-summary.md

      - name: Finalize explicit PR qualification budget
        shell: bash
        if: ${{ always() && github.event_name == 'pull_request' && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success') }}
        run: |
          set +e
          python scripts/ci_qualification.py
          source_status=$?
          python scripts/ci_budget.py finalize --receipt target/ci-budget-finalization.json
          budget_status=$?
          cat target/ci-budget-finalization.json
          if [ "$source_status" -ne 0 ]; then exit "$source_status"; fi
          exit "$budget_status"

  test-formats:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 360 }}
    name: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'ci:qualify') && 'Observation - ' || '' }}Test export formats
    runs-on: ubuntu-latest
    strategy:
      matrix:
        format: [json, jsonl, csv]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Admit explicit PR qualification
        shell: bash
        id: qualification_gate
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ci_qualification.py

      - name: Allocate phase 2 budget
        id: phase_budget_2
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run tokmd-receipt with ${{ matrix.format }} format
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_2.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_2.outputs.minutes || '1') || 360 }}
        uses: ./
        with:
          version: 1.14.0
          format: ${{ matrix.format }}
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 3 budget
        id: phase_budget_3
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify output
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_3.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_3.outputs.minutes || '1') || 360 }}
        run: |
          if [ ! -f "tokmd-receipt.${{ matrix.format }}" ]; then
            echo "::error::tokmd-receipt.${{ matrix.format }} not generated"
            exit 1
          fi
          echo "✓ tokmd-receipt.${{ matrix.format }} generated successfully"

      - name: Finalize explicit PR qualification budget
        shell: bash
        if: ${{ always() && github.event_name == 'pull_request' && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success') }}
        run: |
          set +e
          python scripts/ci_qualification.py
          source_status=$?
          python scripts/ci_budget.py finalize --receipt target/ci-budget-finalization.json
          budget_status=$?
          cat target/ci-budget-finalization.json
          if [ "$source_status" -ne 0 ]; then exit "$source_status"; fi
          exit "$budget_status"

  test-modes:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 360 }}
    name: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'ci:qualify') && 'Observation - ' || '' }}Test explicit modes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Admit explicit PR qualification
        shell: bash
        id: qualification_gate
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ci_qualification.py

      - name: Allocate phase 2 budget
        id: phase_budget_2
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run module mode
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_2.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_2.outputs.minutes || '1') || 360 }}
        id: module
        uses: ./
        with:
          version: 1.14.0
          mode: module
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 3 budget
        id: phase_budget_3
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify module mode
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_3.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_3.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ ! -f tokmd-summary.md ]; then
            echo "::error::tokmd-summary.md not generated in module mode"
            exit 1
          fi
          if [ "${{ steps.module.outputs.summary }}" != "tokmd-summary.md" ]; then
            echo "::error::summary output did not point to tokmd-summary.md"
            exit 1
          fi
          if [ -n "${{ steps.module.outputs.receipt }}" ]; then
            echo "::error::receipt output should be empty in module mode"
            exit 1
          fi
          if [ -n "${{ steps.module.outputs['gate-verdict'] }}" ]; then
            echo "::error::gate-verdict output should be empty in module mode"
            exit 1
          fi
          if [ -n "${{ steps.module.outputs['cockpit-report'] }}" ]; then
            echo "::error::cockpit-report output should be empty in module mode"
            exit 1
          fi
          if [ -n "${{ steps.module.outputs['sensor-report'] }}" ]; then
            echo "::error::sensor-report output should be empty in module mode"
            exit 1
          fi
          if [ -n "${{ steps.module.outputs['baseline-report'] }}" ]; then
            echo "::error::baseline-report output should be empty in module mode"
            exit 1
          fi

      - name: Allocate phase 4 budget
        id: phase_budget_4
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Clean generated files
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_4.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_4.outputs.minutes || '1') || 360 }}
        shell: bash
        run: rm -rf tokmd-summary.md tokmd-receipt.* tokmd-gate-verdict.json tokmd-cockpit-report.json tokmd-sensor-report.json tokmd-baseline.json tokmd.toml comment.md extras

      - name: Allocate phase 5 budget
        id: phase_budget_5
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run export mode
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_5.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_5.outputs.minutes || '1') || 360 }}
        id: export
        uses: ./
        with:
          version: 1.14.0
          mode: export
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 6 budget
        id: phase_budget_6
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify export mode
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_6.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_6.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ ! -f tokmd-receipt.json ]; then
            echo "::error::tokmd-receipt.json not generated in export mode"
            exit 1
          fi
          if [ "${{ steps.export.outputs.receipt }}" != "tokmd-receipt.json" ]; then
            echo "::error::receipt output did not point to tokmd-receipt.json"
            exit 1
          fi
          if [ -n "${{ steps.export.outputs.summary }}" ]; then
            echo "::error::summary output should be empty in export mode"
            exit 1
          fi
          if [ -n "${{ steps.export.outputs['gate-verdict'] }}" ]; then
            echo "::error::gate-verdict output should be empty in export mode"
            exit 1
          fi
          if [ -n "${{ steps.export.outputs['cockpit-report'] }}" ]; then
            echo "::error::cockpit-report output should be empty in export mode"
            exit 1
          fi
          if [ -n "${{ steps.export.outputs['sensor-report'] }}" ]; then
            echo "::error::sensor-report output should be empty in export mode"
            exit 1
          fi
          if [ -n "${{ steps.export.outputs['baseline-report'] }}" ]; then
            echo "::error::baseline-report output should be empty in export mode"
            exit 1
          fi

      - name: Allocate phase 7 budget
        id: phase_budget_7
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Clean generated files
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_7.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_7.outputs.minutes || '1') || 360 }}
        shell: bash
        run: rm -rf tokmd-summary.md tokmd-receipt.* tokmd-gate-verdict.json tokmd-cockpit-report.json tokmd-sensor-report.json tokmd-baseline.json tokmd.toml comment.md extras

      - name: Allocate phase 8 budget
        id: phase_budget_8
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Write gate policy
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_8.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_8.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          cat > tokmd.toml <<'TOML'
          [[gate.rules]]
          name = "has_files"
          pointer = "/derived/totals/files"
          op = "gte"
          value = 1
          TOML

      - name: Allocate phase 9 budget
        id: phase_budget_9
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run gate mode
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_9.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_9.outputs.minutes || '1') || 360 }}
        id: gate
        uses: ./
        with:
          version: 1.14.0
          mode: gate
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 10 budget
        id: phase_budget_10
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify gate mode
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_10.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_10.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ ! -f tokmd-gate-verdict.json ]; then
            echo "::error::tokmd-gate-verdict.json not generated in gate mode"
            exit 1
          fi
          if [ "${{ steps.gate.outputs['gate-verdict'] }}" != "tokmd-gate-verdict.json" ]; then
            echo "::error::gate-verdict output did not point to tokmd-gate-verdict.json"
            exit 1
          fi
          if [ -n "${{ steps.gate.outputs.summary }}" ]; then
            echo "::error::summary output should be empty in gate mode"
            exit 1
          fi
          if [ -n "${{ steps.gate.outputs.receipt }}" ]; then
            echo "::error::receipt output should be empty in gate mode"
            exit 1
          fi
          if [ -n "${{ steps.gate.outputs['cockpit-report'] }}" ]; then
            echo "::error::cockpit-report output should be empty in gate mode"
            exit 1
          fi
          if [ -n "${{ steps.gate.outputs['sensor-report'] }}" ]; then
            echo "::error::sensor-report output should be empty in gate mode"
            exit 1
          fi
          if [ -n "${{ steps.gate.outputs['baseline-report'] }}" ]; then
            echo "::error::baseline-report output should be empty in gate mode"
            exit 1
          fi
          grep -q '"passed": true' tokmd-gate-verdict.json

      - name: Allocate phase 11 budget
        id: phase_budget_11
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run gate mode with same-line multiple paths
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_11.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_11.outputs.minutes || '1') || 360 }}
        id: gate_same_line_paths
        continue-on-error: true
        uses: ./
        with:
          version: 1.14.0
          mode: gate
          paths: ". README.md"
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 12 budget
        id: phase_budget_12
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify same-line gate paths reject
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_12.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_12.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ "${{ steps.gate_same_line_paths.outcome }}" != "failure" ]; then
            echo "::error::gate mode should reject same-line multi-path input"
            exit 1
          fi

      - name: Allocate phase 13 budget
        id: phase_budget_13
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run gate mode with multiline paths
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_13.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_13.outputs.minutes || '1') || 360 }}
        id: gate_multiline_paths
        continue-on-error: true
        uses: ./
        with:
          version: 1.14.0
          mode: gate
          paths: |
            .
            README.md
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 14 budget
        id: phase_budget_14
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify multiline gate paths reject
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_14.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_14.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ "${{ steps.gate_multiline_paths.outcome }}" != "failure" ]; then
            echo "::error::gate mode should reject multiline multi-path input"
            exit 1
          fi

      - name: Allocate phase 15 budget
        id: phase_budget_15
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Clean generated files
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_15.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_15.outputs.minutes || '1') || 360 }}
        shell: bash
        run: rm -rf tokmd-summary.md tokmd-receipt.* tokmd-gate-verdict.json tokmd-cockpit-report.json tokmd-sensor-report.json tokmd-baseline.json tokmd.toml comment.md extras

      - name: Allocate phase 16 budget
        id: phase_budget_16
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run cockpit mode
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_16.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_16.outputs.minutes || '1') || 360 }}
        id: cockpit
        uses: ./
        with:
          version: 1.14.0
          mode: cockpit
          base: HEAD
          head: HEAD
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 17 budget
        id: phase_budget_17
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify cockpit mode
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_17.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_17.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ ! -f tokmd-cockpit-report.json ]; then
            echo "::error::tokmd-cockpit-report.json not generated in cockpit mode"
            exit 1
          fi
          if [ "${{ steps.cockpit.outputs['cockpit-report'] }}" != "tokmd-cockpit-report.json" ]; then
            echo "::error::cockpit-report output did not point to tokmd-cockpit-report.json"
            exit 1
          fi
          if [ -n "${{ steps.cockpit.outputs.summary }}" ]; then
            echo "::error::summary output should be empty in cockpit mode"
            exit 1
          fi
          if [ -n "${{ steps.cockpit.outputs.receipt }}" ]; then
            echo "::error::receipt output should be empty in cockpit mode"
            exit 1
          fi
          if [ -n "${{ steps.cockpit.outputs['gate-verdict'] }}" ]; then
            echo "::error::gate-verdict output should be empty in cockpit mode"
            exit 1
          fi
          if [ -n "${{ steps.cockpit.outputs['sensor-report'] }}" ]; then
            echo "::error::sensor-report output should be empty in cockpit mode"
            exit 1
          fi
          if [ -n "${{ steps.cockpit.outputs['baseline-report'] }}" ]; then
            echo "::error::baseline-report output should be empty in cockpit mode"
            exit 1
          fi
          if [ -n "${{ steps.cockpit.outputs['review-packet'] }}" ]; then
            echo "::error::review-packet output should be empty in cockpit mode without review-packet=true"
            exit 1
          fi
          grep -q '"mode": "cockpit"' tokmd-cockpit-report.json

      - name: Allocate phase 18 budget
