      - name: Set up Rust for local packet binary
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_2.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_2.outputs.minutes || '1') || 360 }}
        uses: dtolnay/rust-toolchain@stable

      - name: Allocate phase 3 budget
        id: phase_budget_3
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Install local tokmd for packet mode
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_3.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_3.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          cargo install --path crates/tokmd --locked --force --root "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/tokmd" packet generate --help >/dev/null

      - name: Allocate phase 4 budget
        id: phase_budget_4
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Read workspace tokmd version
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_4.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_4.outputs.minutes || '1') || 360 }}
        id: workspace_version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tokmd") | .version' | head -n1)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::could not resolve the workspace tokmd version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Allocate phase 5 budget
        id: phase_budget_5
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run packet mode
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_5.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_5.outputs.minutes || '1') || 360 }}
        id: packet
        uses: ./
        with:
          version: 1.14.0
          mode: packet
          base: HEAD
          head: HEAD
          paths: crates/tokmd-types/src
          fail-on: never
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 6 budget
        id: phase_budget_6
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify packet mode
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_6.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_6.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          for path in \
            sensors/tokmd/manifest.json \
            sensors/tokmd/analyze.md \
            sensors/tokmd/analyze.json \
            sensors/tokmd/context.md; do
            if [ ! -f "$path" ]; then
              echo "::error::$path not generated in packet mode"
              exit 1
            fi
          done
          grep -q '"schema": "tokmd.evidence-packet/v1"' sensors/tokmd/manifest.json
          if [ "${{ steps.packet.outputs['packet-manifest'] }}" != "sensors/tokmd/manifest.json" ]; then
            echo "::error::packet-manifest output did not point to sensors/tokmd/manifest.json"
            exit 1
          fi
          if [ "${{ steps.packet.outputs['packet-dir'] }}" != "sensors/tokmd" ]; then
            echo "::error::packet-dir output did not point to sensors/tokmd"
            exit 1
          fi
          case "${{ steps.packet.outputs['packet-status'] }}" in
            complete|partial) ;;
            *)
              echo "::error::unexpected packet-status '${{ steps.packet.outputs['packet-status'] }}'"
              exit 1
              ;;
          esac
          if [ "${{ steps.packet.outputs['tokmd-version'] }}" != "${{ steps.workspace_version.outputs.version }}" ]; then
            echo "::error::omitted binary version should resolve to ${{ steps.workspace_version.outputs.version }}; got '${{ steps.packet.outputs['tokmd-version'] }}'"
            exit 1
          fi
          if [ -z "${{ steps.packet.outputs['warnings-count'] }}" ]; then
            echo "::error::warnings-count output should be set"
            exit 1
          fi
          if [ -z "${{ steps.packet.outputs['review-priority-count'] }}" ]; then
            echo "::error::review-priority-count output should be set"
            exit 1
          fi
          if [ -z "${{ steps.packet.outputs['errors-count'] }}" ]; then
            echo "::error::errors-count output should be set"
            exit 1
          fi
          if [ -n "${{ steps.packet.outputs['artifact-name'] }}" ]; then
            echo "::error::artifact-name output should be empty when artifact upload is disabled"
            exit 1
          fi
          if [ -n "${{ steps.packet.outputs.summary }}" ]; then
            echo "::error::summary output should be empty in packet mode"
            exit 1
          fi

      - name: Allocate phase 7 budget
        id: phase_budget_7
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run packet mode with custom output dir
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_7.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_7.outputs.minutes || '1') || 360 }}
        id: packet_custom
        uses: ./
        with:
          version: 1.14.0
          mode: packet
          base: HEAD
          head: HEAD
          paths: crates/tokmd-types/src
          output-dir: review/packet
          syntax: 'false'
          fail-on: never
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 8 budget
        id: phase_budget_8
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify packet custom output dir
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_8.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_8.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ ! -f review/packet/manifest.json ]; then
            echo "::error::review/packet/manifest.json not generated"
            exit 1
          fi
          if [ -f review/packet/syntax.json ]; then
            echo "::error::syntax.json should be absent when syntax=false"
            exit 1
          fi
          if [ "${{ steps.packet_custom.outputs['packet-dir'] }}" != "review/packet" ]; then
            echo "::error::packet-dir output did not point to review/packet"
            exit 1
          fi

      - name: Allocate phase 9 budget
        id: phase_budget_9
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run packet mode with invalid fail-on
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_9.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_9.outputs.minutes || '1') || 360 }}
        id: packet_bad_fail_on
        continue-on-error: true
        uses: ./
        with:
          version: 1.14.0
          mode: packet
          base: HEAD
          head: HEAD
          paths: crates/tokmd-types/src
          fail-on: sometimes
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 10 budget
        id: phase_budget_10
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify invalid fail-on rejects
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_10.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_10.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ "${{ steps.packet_bad_fail_on.outcome }}" != "failure" ]; then
            echo "::error::packet mode should reject an invalid fail-on value"
            exit 1
          fi

      - name: Allocate phase 11 budget
        id: phase_budget_11
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run packet mode with traversal output-dir
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_11.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_11.outputs.minutes || '1') || 360 }}
        id: packet_bad_output_dir
        continue-on-error: true
        uses: ./
        with:
          version: 1.14.0
          mode: packet
          base: HEAD
          head: HEAD
          paths: crates/tokmd-types/src
          output-dir: ../escape
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 12 budget
        id: phase_budget_12
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify traversal output-dir rejects
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_12.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_12.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ "${{ steps.packet_bad_output_dir.outcome }}" != "failure" ]; then
            echo "::error::packet mode should reject an output-dir with '..' segments"
            exit 1
          fi

      - name: Allocate phase 13 budget
        id: phase_budget_13
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run packet mode with unresolved base
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_13.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_13.outputs.minutes || '1') || 360 }}
        id: packet_unresolved_base
        continue-on-error: true
        uses: ./
        with:
          version: 1.14.0
          mode: packet
          base: refs/heads/__tokmd_missing_base__
          head: HEAD
          paths: crates/tokmd-types/src
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 14 budget
        id: phase_budget_14
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify unresolved packet base rejects
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_14.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_14.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ "${{ steps.packet_unresolved_base.outcome }}" != "failure" ]; then
            echo "::error::packet mode should reject an unresolved base ref"
            exit 1
          fi

      - name: Allocate phase 15 budget
        id: phase_budget_15
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run packet mode with container runtime (verified tag)
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_15.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_15.outputs.minutes || '1') || 360 }}
        id: packet_container
        uses: ./
        with:
          mode: packet
          base: HEAD
          head: HEAD
          paths: crates/tokmd-types/src
          runtime: container
          # Keep this explicit until the exact new release tag passes the
          # seven-step GHCR verification gate. The Action default may advance
          # with the workspace before a matching container is published.
          version: 1.14.0
          output-dir: sensors/tokmd-container
          fail-on: never
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 16 budget
        id: phase_budget_16
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify container runtime packet
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_16.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_16.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          for path in \
            sensors/tokmd-container/manifest.json \
            sensors/tokmd-container/analyze.md \
            sensors/tokmd-container/analyze.json \
            sensors/tokmd-container/context.md; do
            if [ ! -f "$path" ]; then
              echo "::error::$path not generated by the container runtime"
              exit 1
            fi
          done
          grep -q '"schema": "tokmd.evidence-packet/v1"' sensors/tokmd-container/manifest.json
          if [ "${{ steps.packet_container.outputs['packet-dir'] }}" != "sensors/tokmd-container" ]; then
            echo "::error::container packet-dir output did not point to sensors/tokmd-container"
            exit 1
          fi
          case "${{ steps.packet_container.outputs['packet-status'] }}" in
            complete|partial) ;;
            *)
              echo "::error::unexpected container packet-status '${{ steps.packet_container.outputs['packet-status'] }}'"
              exit 1
              ;;
          esac
          if [ "${{ steps.packet_container.outputs['tokmd-version'] }}" != "1.14.0" ]; then
            echo "::error::container tokmd-version output should match the explicitly verified 1.14.0 tag; got '${{ steps.packet_container.outputs['tokmd-version'] }}'"
            exit 1
          fi

      - name: Allocate phase 17 budget
        id: phase_budget_17
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run packet mode with unverified container tag
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_17.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_17.outputs.minutes || '1') || 360 }}
        id: packet_container_unverified
        continue-on-error: true
        uses: ./
        with:
          mode: packet
          base: HEAD
          head: HEAD
          paths: crates/tokmd-types/src
          runtime: container
          version: 0.0.0
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 18 budget
        id: phase_budget_18
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify unverified container tag rejects
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_18.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_18.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ "${{ steps.packet_container_unverified.outcome }}" != "failure" ]; then
            echo "::error::runtime=container should reject an unverified tag"
            exit 1
          fi

      - name: Allocate phase 19 budget
        id: phase_budget_19
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run packet mode with mutable container tag
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_19.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_19.outputs.minutes || '1') || 360 }}
        id: packet_container_latest
        continue-on-error: true
        uses: ./
        with:
          mode: packet
          base: HEAD
          head: HEAD
          paths: crates/tokmd-types/src
          runtime: container
          version: latest
          comment: 'false'
          artifact: 'false'

      - name: Allocate phase 20 budget
        id: phase_budget_20
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify mutable container tag rejects
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_20.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_20.outputs.minutes || '1') || 360 }}
        shell: bash
        run: |
          if [ "${{ steps.packet_container_latest.outcome }}" != "failure" ]; then
            echo "::error::runtime=container should reject the mutable 'latest' tag"
            exit 1
          fi

      - name: Finalize explicit PR qualification budget
        shell: bash
        if: ${{ always() && github.event_name == 'pull_request' && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success') }}
        run: |
          set +e
          python scripts/ci_qualification.py
          source_status=$?
          python scripts/ci_budget.py finalize --receipt target/ci-budget-finalization.json
          budget_status=$?
          cat target/ci-budget-finalization.json
          if [ "$source_status" -ne 0 ]; then exit "$source_status"; fi
          exit "$budget_status"
