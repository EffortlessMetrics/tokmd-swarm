name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  attestations: write
  id-token: write
  packages: write

jobs:
  build-release:
    name: Build Release
    if: github.repository == 'EffortlessMetrics/tokmd'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: tokmd-linux-amd64
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: tokmd-linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            name: tokmd-macos-amd64
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            name: tokmd-macos-arm64
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: tokmd-windows-amd64.exe
            cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --bin tokmd

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} --bin tokmd

      - name: Rename Binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/tokmd.exe ${{ matrix.name }}
          else
            cp target/${{ matrix.target }}/release/tokmd ${{ matrix.name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  build-wasm:
    name: Build tokmd-wasm Artifact
    if: github.repository == 'EffortlessMetrics/tokmd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build tokmd-wasm bundle
        run: npm --prefix web/runner run build:wasm:archive-zip
      - name: Test archive-enabled runner
        run: npm --prefix web/runner test
      - name: Record WASM bundle size
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          du -h --max-depth=1 web/runner/vendor/tokmd-wasm | sort -h > artifacts/tokmd-wasm-bundle-size.txt
      - name: Package reproducible tokmd-wasm artifact
        run: |
          mkdir -p artifacts
          tar --sort=name \
            --owner=0 --group=0 --numeric-owner \
            --mtime='UTC 1970-01-01' \
            -czf "artifacts/tokmd-wasm-${GITHUB_REF_NAME}.tar.gz" \
            -C web/runner/vendor/tokmd-wasm .
          sha256sum "artifacts/tokmd-wasm-${GITHUB_REF_NAME}.tar.gz" > "artifacts/tokmd-wasm-${GITHUB_REF_NAME}.sha256"
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tokmd-wasm-${{ github.ref_name }}
          path: |
            artifacts/tokmd-wasm-${{ github.ref_name }}.tar.gz
            artifacts/tokmd-wasm-${{ github.ref_name }}.sha256
            artifacts/tokmd-wasm-bundle-size.txt

  create-release:
    name: Create GitHub Release
    needs:
      - build-release
      - build-wasm
    if: github.repository == 'EffortlessMetrics/tokmd'
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release-context.outputs.version }}
      release_kind: ${{ steps.release-context.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve exact release context
        id: release-context
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            KIND=rc
          else
            KIND=stable
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          # Reruns must not attach publication/consumer receipts as release assets.
          pattern: tokmd-*
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/tokmd-linux-amd64/tokmd-linux-amd64
            artifacts/tokmd-linux-arm64/tokmd-linux-arm64
            artifacts/tokmd-macos-amd64/tokmd-macos-amd64
            artifacts/tokmd-macos-arm64/tokmd-macos-arm64
            artifacts/tokmd-windows-amd64.exe/tokmd-windows-amd64.exe
            artifacts/tokmd-wasm-${{ github.ref_name }}/tokmd-wasm-${{ github.ref_name }}.tar.gz
            artifacts/tokmd-wasm-${{ github.ref_name }}/tokmd-wasm-${{ github.ref_name }}.sha256
            artifacts/tokmd-wasm-${{ github.ref_name }}/tokmd-wasm-bundle-size.txt

      - name: Generate shell completions
        run: |
          mkdir -p completions
          chmod +x artifacts/tokmd-linux-amd64/tokmd-linux-amd64
          TOKMD=artifacts/tokmd-linux-amd64/tokmd-linux-amd64
          $TOKMD completions bash > completions/tokmd.bash
          $TOKMD completions zsh > completions/_tokmd
          $TOKMD completions fish > completions/tokmd.fish
          $TOKMD completions powershell > completions/_tokmd.ps1
          $TOKMD completions elvish > completions/tokmd.elv
          ls -la completions/
          mkdir -p artifacts/completions
          tar -czvf artifacts/completions/completions.tar.gz -C completions .

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; | sed 's|  \./[^/]*/|  |' > ../checksums.txt
          mv ../checksums.txt .
          cat checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Stable releases become latest only after crates and exact consumer
          # proof pass in finalize-release below. RCs remain prereleases.
          make_latest: false

  publish-crates:
    name: Publish to crates.io
    needs: create-release
    # RCs never enter the registry mutation path.
    if: ${{ github.repository == 'EffortlessMetrics/tokmd' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: tokmd-stable-registry-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Rust
        timeout-minutes: 10
        uses: dtolnay/rust-toolchain@stable

      - name: Verify committed publication identity
        id: identity
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source="$(git rev-parse --verify 'HEAD^{commit}')"
          test "${source}" = "${GITHUB_SHA}"
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "tokmd") | .version')"
          test "${version}" = "${GITHUB_REF_NAME#v}"
          mkdir -p target/publishing
          jq -n --arg source "${source}" --arg tag "${GITHUB_REF_NAME}" \
            --arg version "${version}" --arg repository "${GITHUB_REPOSITORY}" \
            --arg run "${GITHUB_RUN_ID}" --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            '{source_commit:$source,tag:$tag,version:$version,repository:$repository,run_id:$run,run_attempt:$attempt}' \
            > target/publishing/workflow-identity.json

      - name: Restore prior attempt publication receipt
        id: restore
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" -gt 1 || exit 0
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > target/publishing/prior-artifacts.json
          prior="$(jq -ce --arg prefix "release-publish-${GITHUB_SHA}-" \
            --argjson attempt "${GITHUB_RUN_ATTEMPT}" \
            '[.[] | .artifacts[] | select(.name | startswith($prefix)) |
              . + {attempt:(.name | ltrimstr($prefix) | tonumber)} |
              select(.attempt < $attempt)] | sort_by(.attempt) | last // {}' \
            target/publishing/prior-artifacts.json)"
          if [[ "${prior}" = '{}' ]]; then
            echo 'No earlier uploaded receipt; the publisher will reinspect every registry version.'
            exit 0
          fi
          test "$(jq -r '.expired' <<<"${prior}")" = false
          name="$(jq -er '.name' <<<"${prior}")"
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "${name}" --dir target/publishing/previous
          receipt=target/publishing/previous/publish-receipt.json
          if [[ -L "${receipt}" ]]; then
            echo 'Refusing a symlink publication receipt' >&2
            exit 1
          fi
          if [[ -e "${receipt}" ]]; then
            test -s "${receipt}"
            cp -- "${receipt}" target/publishing/publish-receipt.json
          fi
          # The Rust publisher validates schema, source/tree, manifests, options,
          # registry and plan before accepting restored state as a resume input.

      - name: Publish crates with identity-bound receipts
        id: publisher
        timeout-minutes: 130
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--receipt target/publishing/publish-receipt.json \
            --bootstrap tokmd-types,tokmd-envelope --yes)
          if [[ -f target/publishing/publish-receipt.json ]]; then
            args+=(--resume)
          fi
          cargo --locked xtask publish "${args[@]}"

      - name: Observe complete registry inventory
        id: inventory
        if: ${{ always() && steps.identity.outcome == 'success' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cargo --locked xtask publish \
            --registry-inventory target/publishing/registry-inventory.json

      - name: Upload publication evidence even after failure
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publish-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/publishing/workflow-identity.json
            target/publishing/publish-receipt.json
            target/publishing/registry-inventory.json
          if-no-files-found: error
          retention-days: 30

  docker:
    name: Promote Verified Docker Image
    needs: create-release
    # Publish only the exact tag for both RC and stable releases. Mutable
    # aliases are promoted separately after the stable verification gates.
    if: ${{ github.repository == 'EffortlessMetrics/tokmd' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified candidate digest to exact release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/tokmd"
          CANDIDATE="${IMAGE}:verified-candidate-${GITHUB_SHA}"
          EXACT="${IMAGE}:${VERSION}"
          CANDIDATE_PULL="$(docker pull "${CANDIDATE}" 2>&1 | tee /dev/stderr)"
          DIGEST="$(awk '$1 == "Digest:" { print $2; exit }' <<<"${CANDIDATE_PULL}")"
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no immutable candidate digest found for ${CANDIDATE}"
            exit 1
          fi
          docker buildx imagetools create --tag "${EXACT}" "${IMAGE}@${DIGEST}"
          PROMOTED_PULL="$(docker pull "${EXACT}" 2>&1 | tee /dev/stderr)"
          PROMOTED="$(awk '$1 == "Digest:" { print $2; exit }' <<<"${PROMOTED_PULL}")"
          if [[ "${PROMOTED}" != "${DIGEST}" ]]; then
            echo "::error::exact release tag resolved to ${PROMOTED}, expected ${DIGEST}"
            exit 1
          fi
          {
            echo "## Exact container promotion"
            echo "- source_commit: ${GITHUB_SHA}"
            echo "- candidate_tag: ${CANDIDATE}"
            echo "- exact_tag: ${EXACT}"
            echo "- digest: ${DIGEST}"
            echo "- digest_match: pass"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Advisory public GHCR manifest visibility
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/effortlessmetrics/tokmd"
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG

          echo "Checking unauthenticated manifest visibility for ${IMAGE}:${VERSION}"
          if docker manifest inspect "${IMAGE}:${VERSION}"; then
            echo "ghcr_public_visibility=pass tag=${VERSION}"
          else
            echo "::warning title=GHCR public visibility pending::Unauthenticated docker manifest inspect denied for ${IMAGE}:${VERSION}. Verify GHCR package visibility with org package admin access. See docs/publishing-evidence.md."
            echo "ghcr_public_visibility=pending tag=${VERSION}"
            exit 1
          fi

  verify-container:
    name: Verify exact container artifact
    needs: docker
    if: ${{ github.repository == 'EffortlessMetrics/tokmd' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Anonymous pull and version smoke
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/tokmd"
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          REF="${IMAGE}:${VERSION}"
          for attempt in 1 2 3; do
            if docker --config "${DOCKER_CONFIG}" pull "${REF}" && \
              OUT="$(docker --config "${DOCKER_CONFIG}" run --rm "${REF}" --version)"; then
              echo "${OUT}"
              if ! grep -qxE "tokmd ${VERSION}([[:space:]]|$)" <<<"${OUT}"; then
                echo "::error::container reported an unexpected version: ${OUT}"
                exit 1
              fi
              {
                echo "## Exact container verification"
                echo "- image: ${REF}"
                echo "- anonymous_pull: pass"
                echo "- container_version: pass (${OUT})"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Container pull/version attempt ${attempt}/3 failed; retrying after bounded backoff."
            sleep $((attempt * 10))
          done
          echo "::error::exact container pull/version smoke failed after 3 attempts"
          exit 1

      - name: Mounted packet smoke
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/tokmd"
          REF="${IMAGE}:${VERSION}"
          FIXTURE="$(mktemp -d)"
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'rm -rf "${FIXTURE}" "${DOCKER_CONFIG}"' EXIT
          mkdir -p "${FIXTURE}/src"
          printf 'pub fn add(a: i32, b: i32) -> i32 { a + b }\n' > "${FIXTURE}/src/lib.rs"
          git -C "${FIXTURE}" init -q
          git -C "${FIXTURE}" -c user.email=ci@tokmd.dev -c user.name=tokmd-ci add .
          git -C "${FIXTURE}" -c user.email=ci@tokmd.dev -c user.name=tokmd-ci commit -q -m fixture
          docker --config "${DOCKER_CONFIG}" run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/repo -v "${FIXTURE}:/repo" -w /repo "${REF}" \
            packet generate --preset bun-ub --base HEAD --head HEAD --no-syntax src
          test "$(jq -r '.schema' "${FIXTURE}/sensors/tokmd/manifest.json")" = 'tokmd.evidence-packet/v1'
          test "$(jq -r '.status' "${FIXTURE}/sensors/tokmd/manifest.json")" = 'complete'
          test -s "${FIXTURE}/sensors/tokmd/analyze.json"
          test "$(jq -r '.artifacts | length' "${FIXTURE}/sensors/tokmd/manifest.json")" -gt 0
          jq -e '
            .mode == "analysis" and
            .status == "complete" and
            (.source.inputs | length > 0) and
            (.derived != null)
          ' "${FIXTURE}/sensors/tokmd/analyze.json" > /dev/null
          {
            echo "- mounted_packet: pass"
            echo "- packet_schema: tokmd.evidence-packet/v1"
            echo "- packet_status: complete"
            echo "- packet_content: pass"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-action:
    name: Verify exact-tag Action default
    needs: [create-release, verify-container]
    if: ${{ github.repository == 'EffortlessMetrics/tokmd' }}
    uses: ./.github/workflows/release-consumer-smoke.yml
    with:
      release_repository: ${{ github.repository }}
      tag: ${{ github.ref_name }}
      expected_version: ${{ needs.create-release.outputs.release_version }}
      release_kind: ${{ needs.create-release.outputs.release_kind }}

  finalize-release:
    name: Finalize stable GitHub Release
    needs: [publish-crates, verify-container, verify-action]
    if: ${{ github.repository == 'EffortlessMetrics/tokmd' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Finalize stable release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.draft' <<<"${release}")" = false
          test "$(jq -r '.prerelease' <<<"${release}")" = false
          gh release edit "${TAG}" --repo "${REPOSITORY}" --draft=false --latest
          latest="$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.tag_name')"
          test "${latest}" = "${TAG}"
          {
            echo "- stable_release: finalized"
            echo "- latest_tag: ${latest}"
          } >> "${GITHUB_STEP_SUMMARY}"

  promote-aliases:
    name: Promote stable aliases
    needs: finalize-release
    if: ${{ github.repository == 'EffortlessMetrics/tokmd' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # contents:write moves the v1 tag; packages:write promotes GHCR aliases
    # only after exact release, crates, container, Action, and full consumer
    # verification pass.
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Move v1 tag before mutable aliases
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const major = tag.split('.')[0];
            const ref = `tags/${major}`;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha,
                force: true,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${ref}`,
                sha: context.sha,
              });
            }

      - name: Move mutable container aliases after Git tag
        shell: bash
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${CR_PAT}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR _ <<< "${VERSION}"
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/tokmd"
          for alias in "${MAJOR}" "${MAJOR}.${MINOR}" latest; do
            docker buildx imagetools create --tag "${IMAGE}:${alias}" "${IMAGE}:${VERSION}"
          done
