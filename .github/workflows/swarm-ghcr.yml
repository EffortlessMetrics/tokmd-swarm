name: Swarm Image Qualification

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "vendor/**"
      - "xtask/**"
      - "fuzz/**"
      - "scripts/ci_swarm_image.py"
      - "scripts/ci_swarm_image_test.py"
      - ".github/workflows/swarm-ghcr.yml"
      - ".github/workflows/swarm-ghcr-publish.yml"
  workflow_dispatch:

# Automatic integration can build and smoke an image, never authenticate or push.
permissions:
  contents: read

concurrency:
  group: swarm-image-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify Swarm OCI Image
    if: github.repository == 'EffortlessMetrics/tokmd-swarm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate native source and boundary controls
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest scripts/ci_swarm_image_test.py
          mkdir -p "$RUNNER_TEMP/swarm-image"
      - name: Install OCI transport from runner package sources
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build local archive without registry writes
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/swarm-image/image.tar
          labels: |
            org.opencontainers.image.source=https://github.com/EffortlessMetrics/tokmd-swarm
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify archive and smoke its exact image
        run: python3 scripts/ci_swarm_image.py qualify --directory "$RUNNER_TEMP/swarm-image"
      - name: Retain exact qualified bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swarm-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swarm-image/image.tar
            ${{ runner.temp }}/swarm-image/qualification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
