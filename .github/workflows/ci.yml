name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to qualify
        required: true
        type: string
      head_sha:
        description: Exact PR head; select its branch as the dispatch ref
        required: true
        type: string
      base_sha:
        description: Exact current main commit
        required: true
        type: string
      generation:
        description: Exact head_sha:base_sha pair
        required: true
        type: string
      expected_green:
        description: Local source proof and independent review are expected green
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Observation events never share a cancellation domain with qualification.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('qualification-{0}-{1}', inputs.pull_request, inputs.generation) || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci:qualify' && format('qualification-{0}-{1}', github.event.pull_request.number, github.sha)) || format('observation-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  admission:
    name: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'ci:qualify') && 'Observation - ' || '' }}Admit explicit qualification
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
      mode: ${{ steps.admit.outputs.mode }}
      deadline_epoch: ${{ steps.admit.outputs.deadline_epoch }}
    steps:
      - name: Start shared work budget
        id: deadline
        run: echo "deadline_epoch=$(( $(date +%s) + 20 * 60 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate explicit qualification request
        id: admit
        env:
          QUALIFICATION_DEADLINE: ${{ steps.deadline.outputs.deadline_epoch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci_qualification.py

  # Phase 2 (#226): single tight gate — route + one required check.
  # Normative spec: docs/specs/ub-review-ci-gate.md
  route:
    if: needs.admission.outputs.admitted == 'true'
    needs: admission
    name: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'ci:qualify') && 'Observation - ' || '' }}Route CI runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      runner_kind: ${{ steps.route.outputs.runner_kind }}
    steps:
      - name: Decide gate runner (self-hosted primary, gh-hosted overflow)
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN }}
        run: |
          set -uo pipefail
          GH='"ubuntu-latest"'
          SELF_HOSTED='["self-hosted","linux","x64","em-ci","trusted-pr","rust-small"]'
          emit() {
            echo "runner=$1" >> "$GITHUB_OUTPUT"
            echo "runner_kind=$2" >> "$GITHUB_OUTPUT"
          }
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
            emit "$GH" github "fork PR"
            exit 0
          fi
          if [[ -z "${GH_TOKEN:-}" ]]; then
            emit "$GH" github "missing token"
            exit 0
          fi
          set +e
          RESP="$(timeout 20s gh api "orgs/EffortlessMetrics/actions/runners?per_page=100" 2>route.err)"
          CODE=$?
          set -e
          if [[ $CODE -ne 0 ]]; then
            emit "$GH" github "api failed"
            exit 0
          fi
          # The gate requests the rust-small label set below. Check all
          # required capability labels on the same idle runner; flattening
          # labels across runners can select an idle review runner while the
          # rust-small pool is fully occupied, leaving the required job queued
          # even though the route step reported self-hosted capacity.
          if jq -e 'any(.runners[]; .status=="online" and .busy==false and ([.labels[].name] | index("trusted-pr")) and ([.labels[].name] | index("rust-small")))' <<<"$RESP" >/dev/null; then
            emit "$SELF_HOSTED" self-hosted "idle trusted rust-small runner"
          else
            emit "$GH" github "no idle capacity"
          fi

  tokmd-rust-result:
    if: always()
    name: Tokmd Rust Result${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'ci:qualify') && ' (qualification not requested)' || '' }}
    outputs:
      source_validated: ${{ steps.source_before.outcome == 'success' && steps.source_after.outcome == 'success' }}
      rustc_version: ${{ steps.compiler_version.outputs.version }}
      rustup_toolchain: ${{ steps.compiler_version.outputs.toolchain }}
    needs: [admission, route, deny]
    runs-on: ${{ (needs.route.outputs.runner && fromJSON(needs.route.outputs.runner)) || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Refuse unrequested or failed admission
        env:
          ADMITTED: ${{ needs.admission.outputs.admitted }}
          ADMISSION_RESULT: ${{ needs.admission.result }}
          BASELINE_RESULT: ${{ needs.deny.result }}
        run: |
          if ! { test "$ADMISSION_RESULT" = success && test "$ADMITTED" = true && test "$BASELINE_RESULT" = success; }; then
            echo "::error::admission=$ADMISSION_RESULT admitted=$ADMITTED baseline=$BASELINE_RESULT" >&2
            exit 1
          fi
      - name: Anchor shared setup budget
        id: setup_budget
        env:
          QUALIFICATION_DEADLINE: ${{ needs.admission.outputs.deadline_epoch }}
        run: |
          python3 - <<'PY'
          import os, sys, time
          deadline = os.environ.get("QUALIFICATION_DEADLINE", "")
          if not deadline.isdecimal():
              sys.exit(124)
          remaining = int(deadline) - time.time()
          minutes = int((remaining - 60) // 60)
          if not 1 <= minutes <= 20:
              sys.exit(124)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              print(f"CI_BUDGET_MONO_NS={time.monotonic_ns() + int(remaining * 1e9)}", file=env)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"minutes={minutes}", file=output)
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source_checkout
        timeout-minutes: ${{ fromJSON(steps.setup_budget.outputs.minutes || '1') }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact qualification before setup
        id: source_before
        env:
          QUALIFICATION_DEADLINE: ${{ needs.admission.outputs.deadline_epoch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci_qualification.py

      - name: Allocate qualification control test budget
        id: control_test_budget
        run: python3 scripts/ci_budget.py allowance

      - name: Test qualification controls
        timeout-minutes: ${{ fromJSON(steps.control_test_budget.outputs.minutes || '1') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {spawnSync} = require('node:child_process');
            const result = spawnSync('python3',
              ['-m', 'unittest', 'discover', '-s', 'scripts', '-p', 'ci_*_test.py'],
              {stdio: 'inherit', env: {...process.env, TOKMD_CI_NODE: process.execPath}, timeout: 55000});
            if (result.error) throw result.error;
            if (result.status !== 0) core.setFailed(`Qualification control tests failed: status=${result.status}, signal=${result.signal}`);

      - name: Allocate toolchain budget
        id: toolchain_budget
        run: python3 scripts/ci_budget.py allowance

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: ${{ fromJSON(steps.toolchain_budget.outputs.minutes || '1') }}
        with:
          components: rustfmt, clippy

      - name: Record selected compiler version
        id: compiler_version
        run: |
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
          echo "toolchain=${RUSTUP_TOOLCHAIN:-stable}" >> "$GITHUB_OUTPUT"

      - name: Use larger writable target dir on GitHub-hosted overflow
        if: needs.route.outputs.runner_kind == 'github'
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/target" >> "$GITHUB_ENV"

      - name: Use workspace gate target on self-hosted
        if: needs.route.outputs.runner_kind == 'self-hosted'
        run: |
          echo "CARGO_TARGET_DIR=${GITHUB_WORKSPACE}/target/ci-gate" >> "$GITHUB_ENV"
          mkdir -p target/ci-gate
          # Best-effort reclaim of legacy /tmp orphans from pre-fix disposable gate runs (#309).
          find /tmp -maxdepth 1 -type d -name 'tokmd-gate-target-*' -mmin +30 -exec rm -rf {} + 2>/dev/null || true

      - name: Allocate cache budget
        id: cache_budget
        continue-on-error: true
        run: python3 scripts/ci_budget.py allowance --max-minutes 5

      - name: Restore Rust build cache (best effort)
        id: rust_cache
        if: ${{ steps.cache_budget.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.cache_budget.outputs.minutes || '1') }}
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-directories: ${{ runner.temp }}/target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Record cache outcome
        if: always()
        timeout-minutes: 1
        run: |
          echo "Rust cache outcome: ${{ steps.rust_cache.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize CI observability receipt
        if: always()
        run: |
          mkdir -p target/ci-core
          mark_clock() {
            python3 -c 'import datetime,sys,time; p=sys.argv[1]; open(p+"_mono_ns","w",encoding="utf-8").write(str(time.monotonic_ns())+"\n"); open(p+"_utc","w",encoding="utf-8").write(datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z")+"\n")' "$1"
          }
          mark_clock target/ci-core/job_started

      - name: Fast precontext and launch core gate
        timeout-minutes: 19
        env:
          RUNNER_KIND: ${{ needs.route.outputs.runner_kind }}
          QUALIFICATION_DEADLINE: ${{ needs.admission.outputs.deadline_epoch }}
        run: |
          set +e
          mkdir -p target/ci-core
          mark_clock() {
            python3 -c 'import datetime,sys,time; p=sys.argv[1]; open(p+"_mono_ns","w",encoding="utf-8").write(str(time.monotonic_ns())+"\n"); open(p+"_utc","w",encoding="utf-8").write(datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z")+"\n")' "$1"
          }
          mark_clock target/ci-core/core_started
          if [ "${RUNNER_KIND}" = "self-hosted" ]; then
            df -h . || true
          else
            df -h /
          fi
          {
            echo "# Deterministic precontext for ub-review"
            echo
            echo "- core gate (gates the merge; serial Cargo lane): cargo --locked xtask gate --check"
            echo "- core tests (serial Cargo lane): cargo test --locked --all-features"
            echo "- xtask tests (serial Cargo lane): cargo test --locked -p xtask --all-features"
            echo "- proof policy (serial Cargo lane): cargo --locked xtask proof-policy --check"
            echo "- runner: ${RUNNER_KIND:-github} event: ${GITHUB_EVENT_NAME}"
          } > target/ci-core/precontext.md
          # Keep Cargo proof lanes serial on the selected runner. Running the
          # gate, full tests, and advisory review concurrently can starve the
          # gate long enough to produce a false timeout marker (124) even when
          # the same commands pass with the available resources.
          # Share one admission deadline across the retained commands while
          # preserving command timeout (124), source failure and complete logs.
          run_bounded() {
            label="$1"
            marker="$2"
            log="$3"
            shift 3
            echo "::group::${label} (shared qualification deadline)"
            echo "started $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee "$log"
            # The existing command boundary owns one unique child process group.
            # Preserve source exits; timeout/cancellation are separate receipts.
            python3 scripts/ci_budget.py run --marker "$marker" -- "$@" 2>&1 | tee -a "$log"
            status="${PIPESTATUS[0]}"
            echo "$status" > "$marker"
            if [ "$(jq -r '.terminal_reason // ""' "${marker}.json" 2>/dev/null)" = cancelled ]; then
              mark_clock target/ci-core/core_completed
              exit "$status"
            fi
            echo "finished $(date -u +%Y-%m-%dT%H:%M:%SZ) exit=${status}" | tee -a "$log"
            echo "::endgroup::"
          }

          # Locked-command contract (AGENTS.md / agents/shared/repo.md): every
          # governed Cargo command in this required gate resolves against the
          # committed `Cargo.lock`, so a missing or stale lock fails visibly
          # instead of silently changing dependency state. `--locked` precedes
          # the `xtask` alias because `.cargo/config.toml` expands it to
          # `run -p xtask --`: the launcher itself resolves dependencies, and
          # Cargo applies global options before expanding an alias. Without it
          # the launcher could rewrite the lock before the inner checks run.
          # The gate task passes `--locked` to its own check, clippy, and
          # compile-only test steps; its `cargo fmt` step stays unlocked
          # because fmt resolves no dependencies and rejects the flag. The
          # claim covers this job only: platform, coverage, mutation, and
          # scheduled lanes are outside it.
          run_bounded "cargo --locked xtask gate --check" target/ci-core/core_exit target/ci-core/core.log cargo --locked xtask gate --check
          run_bounded "cargo test --locked --all-features" target/ci-core/test_exit target/ci-core/test.log cargo test --locked --all-features
          # `xtask` is not a default-member, so the lane above never builds it.
          # Test it explicitly: it owns the publish plan, the policy linters,
          # and the no-panic checker, and breakage there is invisible otherwise.
          run_bounded "cargo test --locked -p xtask --all-features" target/ci-core/xtask_test_exit target/ci-core/xtask_test.log cargo test --locked -p xtask --all-features
          run_bounded "cargo --locked xtask proof-policy --check" target/ci-core/proof_policy_exit target/ci-core/proof_policy.log cargo --locked xtask proof-policy --check
          mark_clock target/ci-core/core_completed
          echo "completed serial core gate, tests, and proof-policy"

      - name: Allocate advisory review budget
        id: review_budget
        continue-on-error: true
        if: ${{ success() && needs.admission.outputs.admitted == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        run: python3 scripts/ci_budget.py allowance --reserve-seconds 120 --max-minutes 15

      - name: Record UB Review start
        if: ${{ steps.review_budget.outcome == 'success' && success() && needs.admission.outputs.admitted == 'true' && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        run: |
          mark_clock() {
            python3 -c 'import datetime,sys,time; p=sys.argv[1]; open(p+"_mono_ns","w",encoding="utf-8").write(str(time.monotonic_ns())+"\n"); open(p+"_utc","w",encoding="utf-8").write(datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z")+"\n")' "$1"
          }
          mark_clock target/ci-core/ub_review_started

      - name: UB Review (advisory)
        id: ubreview
        timeout-minutes: ${{ fromJSON(steps.review_budget.outputs.minutes || '1') }}
        if: ${{ steps.review_budget.outcome == 'success' && success() && needs.admission.outputs.admitted == 'true' && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
        continue-on-error: true
        uses: EffortlessMetrics/ub-review@e1e41124e0468b3714827fd32574c8c583803b72
        with:
          preset: bun-ub
          mode: review-direct
          posting: review
          setup-rust: false
          tool-bundle: core
          provider-policy: minimax-primary
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          minimax-model: MiniMax-M3
          opencode-api-key: ${{ secrets.OPENCODE }}
          opencode-model: deepseek-v4-flash
          base: origin/${{ github.base_ref }}
          pr-thread-context: target/ci-core/precontext.md
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-summary: true

      - name: UB Review advisory status
        if: ${{ always() }}
        env:
          UB_OUTCOME: ${{ steps.ubreview.outcome }}
        run: |
          case "${UB_OUTCOME}" in
            success)
              echo "ub-review advisory lane completed; see the grouped PR review." >> "$GITHUB_STEP_SUMMARY"
              ;;
            skipped|"")
              echo "ub-review advisory lane skipped (fork PR or non-PR event); deterministic gate verdict stands." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "ub-review advisory lane failed (${UB_OUTCOME}): check provider secrets and model availability, then re-run. Deterministic gate verdict stands." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          mark_clock() {
            python3 -c 'import datetime,sys,time; p=sys.argv[1]; open(p+"_mono_ns","w",encoding="utf-8").write(str(time.monotonic_ns())+"\n"); open(p+"_utc","w",encoding="utf-8").write(datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00","Z")+"\n")' "$1"
          }
          if [ -n "${UB_OUTCOME:-}" ] && [ "${UB_OUTCOME}" != "skipped" ]; then
            mark_clock target/ci-core/ub_review_completed
          fi

      - name: Revalidate exact qualification after proof
        id: source_after
        if: ${{ success() && !cancelled() && needs.admission.outputs.admitted == 'true' }}
        env:
          QUALIFICATION_DEADLINE: ${{ needs.admission.outputs.deadline_epoch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/ci_qualification.py

      - name: Assert core gate verdict
        if: ${{ always() }}
        env:
          RUNNER_KIND: ${{ needs.route.outputs.runner_kind }}
        run: |
          set -uo pipefail
          # The synchronous producer has already returned; missing proof is a failure.
          for marker in core_exit test_exit xtask_test_exit proof_policy_exit; do
            if [ ! -f "target/ci-core/${marker}" ]; then
              echo "124" > "target/ci-core/${marker}"
              echo "${marker}: unavailable after bounded core-proof step" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          core_exit="$(cat target/ci-core/core_exit)"
          test_exit="$(cat target/ci-core/test_exit)"
          xtask_test_exit="$(cat target/ci-core/xtask_test_exit)"
          proof_policy_exit="$(cat target/ci-core/proof_policy_exit)"

          # The producer already runs serially. A failed proof stays failed;
          # an unbounded retry here would escape the shared work budget.

          # Preserve the producer outcomes in the final receipt.
          printf '%s\n' "${core_exit}" > target/ci-core/core_exit
          printf '%s\n' "${test_exit}" > target/ci-core/test_exit
          printf '%s\n' "${xtask_test_exit}" > target/ci-core/xtask_test_exit
          printf '%s\n' "${proof_policy_exit}" > target/ci-core/proof_policy_exit

          {
            echo "## Deterministic core gate"
            if [ "${core_exit}" = "0" ]; then
              echo "Gate: PASS (cargo --locked xtask gate --check exit 0)"
            else
              echo "Gate: FAIL (exit ${core_exit})"
            fi
            if [ "${test_exit}" = "0" ]; then
              echo "Tests: PASS (cargo test --locked --all-features exit 0)"
            else
              echo "Tests: FAIL (exit ${test_exit})"
            fi
            if [ "${xtask_test_exit}" = "0" ]; then
              echo "xtask tests: PASS (cargo test --locked -p xtask --all-features exit 0)"
            else
              echo "xtask tests: FAIL (exit ${xtask_test_exit})"
            fi
            if [ "${proof_policy_exit}" = "0" ]; then
              echo "Proof policy: PASS (cargo --locked xtask proof-policy --check exit 0)"
            else
              echo "Proof policy: FAIL (exit ${proof_policy_exit})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "${core_exit}" = "0"
          test "${test_exit}" = "0"
          test "${xtask_test_exit}" = "0"
          test "${proof_policy_exit}" = "0"

      - name: Write UB Review observability receipt
        if: ${{ always() }}
        continue-on-error: true
        env:
          UB_OUTCOME: ${{ steps.ubreview.outcome }}
          RUNNER_KIND: ${{ needs.route.outputs.runner_kind }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          receipt_dir="target/ci-core"
          read_marker() {
            if [ -s "$1" ]; then
              cat "$1"
            else
              echo ""
            fi
          }
          read_mono() {
            value="$1"
            case "$value" in
              ''|*[!0-9]*) echo "" ;;
              *) echo "$value" ;;
            esac
          }
          json_number() {
            if [ -n "$1" ]; then echo "$1"; else echo "null"; fi
          }
          job_started="$(read_mono "$(read_marker "${receipt_dir}/job_started_mono_ns")")"
          core_started="$(read_mono "$(read_marker "${receipt_dir}/core_started_mono_ns")")"
          core_completed="$(read_mono "$(read_marker "${receipt_dir}/core_completed_mono_ns")")"
          ub_started="$(read_mono "$(read_marker "${receipt_dir}/ub_review_started_mono_ns")")"
          ub_completed="$(read_mono "$(read_marker "${receipt_dir}/ub_review_completed_mono_ns")")"
          core_started_utc="$(read_marker "${receipt_dir}/core_started_utc")"
          core_completed_utc="$(read_marker "${receipt_dir}/core_completed_utc")"
          ub_started_utc="$(read_marker "${receipt_dir}/ub_review_started_utc")"
          ub_completed_utc="$(read_marker "${receipt_dir}/ub_review_completed_utc")"
          timing_integrity="valid"
          core_elapsed=0
          if [ -n "${core_started}" ] && [ -n "${core_completed}" ] && [ "${core_completed}" -ge "${core_started}" ]; then
            core_elapsed=$(( (core_completed - core_started) / 1000000000 ))
          else
            timing_integrity="incomplete_or_reversed"
          fi
          ub_elapsed=0
          if [ -n "${ub_started}" ] && [ -n "${ub_completed}" ] && [ "${ub_completed}" -ge "${ub_started}" ]; then
            ub_elapsed=$(( (ub_completed - ub_started) / 1000000000 ))
          elif [ -n "${ub_started}" ] || [ -n "${ub_completed}" ]; then
            timing_integrity="incomplete_or_reversed"
          fi
          core_exit="$(read_marker "${receipt_dir}/core_exit")"
          test_exit="$(read_marker "${receipt_dir}/test_exit")"
          xtask_test_exit="$(read_marker "${receipt_dir}/xtask_test_exit")"
          proof_policy_exit="$(read_marker "${receipt_dir}/proof_policy_exit")"
          timeout_classification="not_timeout"
          terminal_reason="completed"
          cancelled_command=false
          for marker in core_exit test_exit xtask_test_exit proof_policy_exit; do
            exit_code="$(read_marker "${receipt_dir}/${marker}")"
            reason=""
            if [ -s "${receipt_dir}/${marker}.json" ]; then
              reason="$(jq -r '.terminal_reason // ""' "${receipt_dir}/${marker}.json" 2>/dev/null)"
            fi
            if [ "$reason" = cancelled ]; then
              cancelled_command=true
            elif [ "$reason" = budget_exhausted ] || { [ -z "$reason" ] && [ "$exit_code" = 124 ]; }; then
              timeout_classification="bounded_command_timeout"
              terminal_reason="core_proof_timeout"
            fi
          done
          if [ "$cancelled_command" = true ]; then
            timeout_classification="not_timeout"
            terminal_reason="core_proof_cancelled"
          fi
          if [ "${terminal_reason}" = "completed" ]; then
            for exit_code in "${core_exit}" "${test_exit}" "${xtask_test_exit}" "${proof_policy_exit}"; do
              if [ -n "${exit_code}" ] && [ "${exit_code}" != "0" ]; then
                terminal_reason="core_proof_failed"
              fi
            done
          fi
          if [ "${terminal_reason}" = "completed" ]; then
            case "${UB_OUTCOME:-}" in
              success) terminal_reason="completed" ;;
              failure) terminal_reason="ub_review_advisory_failed" ;;
              skipped|"") terminal_reason="ub_review_skipped" ;;
              cancelled) terminal_reason="ub_review_cancelled" ;;
              *) terminal_reason="ub_review_unexpected_${UB_OUTCOME:-unknown}" ;;
            esac
          fi
          jq -cn \
            --arg schema_version "tokmd.ci.ub-review.v1" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg job "${GITHUB_JOB}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg runner_kind "${RUNNER_KIND:-github}" \
            --arg ub_provider_policy "minimax-primary" \
            --arg ub_model "MiniMax-M3" \
            --arg ub_outcome "${UB_OUTCOME:-unknown}" \
            --arg terminal_reason "${terminal_reason}" \
            --arg timeout_classification "${timeout_classification}" \
            --arg timing_integrity "${timing_integrity}" \
            --argjson job_started_mono_ns "$(json_number "${job_started}")" \
            --argjson core_started_mono_ns "$(json_number "${core_started}")" \
            --argjson core_completed_mono_ns "$(json_number "${core_completed}")" \
            --argjson core_elapsed_seconds "${core_elapsed}" \
            --argjson ub_started_mono_ns "$(json_number "${ub_started}")" \
            --argjson ub_completed_mono_ns "$(json_number "${ub_completed}")" \
            --argjson ub_elapsed_seconds "${ub_elapsed}" \
            --arg core_started_utc "${core_started_utc}" \
            --arg core_completed_utc "${core_completed_utc}" \
            --arg ub_started_utc "${ub_started_utc}" \
            --arg ub_completed_utc "${ub_completed_utc}" \
            '{schema_version:$schema_version,workflow:$workflow,run_id:$run_id,run_attempt:$run_attempt,job:$job,head_sha:$head_sha,runner_kind:$runner_kind,observability_started_mono_ns:$job_started_mono_ns,timeout_minutes:20,terminal_reason:$terminal_reason,timeout_classification:$timeout_classification,timing_integrity:$timing_integrity,phases:{core:{started_mono_ns:$core_started_mono_ns,completed_mono_ns:$core_completed_mono_ns,started_utc:(if $core_started_utc == "" then null else $core_started_utc end),completed_utc:(if $core_completed_utc == "" then null else $core_completed_utc end),elapsed_seconds:$core_elapsed_seconds},ub_review:{started_mono_ns:$ub_started_mono_ns,completed_mono_ns:$ub_completed_mono_ns,started_utc:(if $ub_started_utc == "" then null else $ub_started_utc end),completed_utc:(if $ub_completed_utc == "" then null else $ub_completed_utc end),elapsed_seconds:$ub_elapsed_seconds,outcome:$ub_outcome,model_call:{provider_policy:$ub_provider_policy,model:null,selection:"not_exposed",candidates:[{provider_policy:$ub_provider_policy,model:$ub_model},{provider_policy:"opencode-fallback",model:"deepseek-v4-flash"}],outcome:$ub_outcome}}}}' \
