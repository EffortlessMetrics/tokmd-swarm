            BASE_REV="origin/$BASE_REF"
            git fetch origin "$BASE_REF":"refs/remotes/origin/$BASE_REF" || true
          elif [ -n "${PUSH_BEFORE}" ] && ! printf '%s' "${PUSH_BEFORE}" | grep -Eq '^0+$'; then
            BASE_REF="main"
            BASE_REV="${PUSH_BEFORE}"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE_REF="main"
            BASE_REV="HEAD^"
          else
            BASE_REF="main"
            BASE_REV="HEAD"
          fi

          cargo xtask mutation-scope \
            --base-ref "$BASE_REF" \
            --base "$BASE_REV" \
            --head HEAD \
            --max-files 20 \
            --all-changed-files all_changed_files.txt \
            --changed-files changed_files.txt \
            --json-output target/mutation/mutation-scope.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Allocate phase 5 budget
        id: phase_budget_5
        if: ${{ (steps.changed.outputs.count != '0') && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Mutation Testing
        timeout-minutes: ${{ fromJSON(steps.phase_budget_5.outputs.minutes || '1') }}
        if: ${{ (steps.changed.outputs.count != '0') && steps.phase_budget_5.outcome == 'success' }}
        env:
          CI: true
        run: |
          set -euo pipefail
          echo "Running mutation testing on ${{ steps.changed.outputs.count }} changed file(s)..."

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || continue

            # Microcrate dividend: run from crate dir when possible
            crate_dir=""
            if [[ "$file" == crates/*/* ]]; then
              crate_dir="$(echo "$file" | cut -d/ -f1-2)"
            fi

            echo "::group::Mutants: $file"
            if [[ -n "$crate_dir" && -f "$crate_dir/Cargo.toml" ]]; then
              rel="${file#$crate_dir/}"
              (cd "$crate_dir" && cargo mutants --file "$rel" --timeout 300)
            else
              cargo mutants --file "$file" --timeout 300
            fi
            echo "::endgroup::"
          done < changed_files.txt

          echo "✓ All mutations caught or unviable (0 MISSED)"

      - name: Allocate phase 6 budget
        id: phase_budget_6
        if: ${{ (steps.changed.outputs.count == '0' && steps.changed.outputs.scope_exceeded != 'true') && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Skip notice
        timeout-minutes: ${{ fromJSON(steps.phase_budget_6.outputs.minutes || '1') }}
        if: ${{ (steps.changed.outputs.count == '0' && steps.changed.outputs.scope_exceeded != 'true') && steps.phase_budget_6.outcome == 'success' }}
        run: echo "No production Rust files changed - skipping mutation testing"

      - name: Allocate phase 7 budget
        id: phase_budget_7
        if: ${{ (steps.changed.outputs.scope_exceeded == 'true') && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Scope exceeded notice
        timeout-minutes: ${{ fromJSON(steps.phase_budget_7.outputs.minutes || '1') }}
        if: ${{ (steps.changed.outputs.scope_exceeded == 'true') && steps.phase_budget_7.outcome == 'success' }}
        run: echo "Mutation scope exceeded - selected files were cleared. See target/mutation/mutation-scope.json."

      - name: Allocate phase 8 budget
        id: phase_budget_8
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Upload mutants report
        timeout-minutes: ${{ fromJSON(steps.phase_budget_8.outputs.minutes || '1') }}
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.phase_budget_8.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutants-report
          path: |
            target/mutation/mutation-scope.json
            all_changed_files.txt
            changed_files.txt
            mutants.out/
            crates/**/mutants.out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Finalize shared qualification budget
        if: ${{ always() && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          python scripts/ci_qualification.py
          source_status=$?
          python scripts/ci_budget.py finalize --receipt target/ci-budget-finalization.json
          budget_status=$?
          cat target/ci-budget-finalization.json
          if [ "$source_status" -ne 0 ]; then exit "$source_status"; fi
          exit "$budget_status"

  ci-actuals:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 360 }}
    name: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'ci:qualify') && 'Observation - ' || '' }}CI Actuals (Advisory)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    if: needs.admission.outputs.admitted == 'true' && needs.deny.result == 'success' && needs.tokmd-rust-result.outputs.source_validated == 'true' && always()
    continue-on-error: true
    needs:
      - admission
      - route
      - tokmd-rust-result
      - detect
      - msrv
      - build-windows
      - build-macos
      - deny
      - wasm-compile
      - typos
      - proptest-smoke
      - publish-plan
      - version-consistency
      - docs-check
      - nix-pr
      - mutation
      - feature-boundaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        continue-on-error: true

      - name: Revalidate shared qualification budget
        id: job_budget
        shell: bash
        env:
          QUALIFICATION_DEADLINE: ${{ needs.admission.outputs.deadline_epoch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ci_qualification.py

      - name: Reuse an already selected compiler
        id: cached_compiler
        if: steps.job_budget.outcome == 'success'
        timeout-minutes: 1
        shell: python3 scripts/ci_budget.py run --marker target/ci-budget/compiler-probe --reserve-seconds 0 -- bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_RUSTC: ${{ needs.tokmd-rust-result.outputs.rustc_version }}
          EXPECTED_TOOLCHAIN: ${{ needs.tokmd-rust-result.outputs.rustup_toolchain }}
        run: |
          actual="$(rustup run "$EXPECTED_TOOLCHAIN" rustc --version 2>/dev/null || true)"
          if [ -n "$EXPECTED_RUSTC" ] && [ "$actual" = "$EXPECTED_RUSTC" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo "RUSTUP_TOOLCHAIN=$EXPECTED_TOOLCHAIN" >> "$GITHUB_ENV"
            echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Allocate phase 2 budget
        id: phase_budget_2
        continue-on-error: true
        if: ${{ steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ (steps.phase_budget_2.outcome == 'success') && steps.cached_compiler.outputs.ready != 'true' }}
        timeout-minutes: ${{ fromJSON(steps.phase_budget_2.outputs.minutes || '1') }}
        continue-on-error: true

      - name: Allocate phase 3 budget
        id: phase_budget_3
        continue-on-error: true
        if: ${{ steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.phase_budget_3.outcome == 'success' }}
        timeout-minutes: ${{ fromJSON(steps.phase_budget_3.outputs.minutes || '1') }}
        continue-on-error: true
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Allocate phase 4 budget
        id: phase_budget_4
        continue-on-error: true
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Generate CI timings sidecar
        timeout-minutes: ${{ fromJSON(steps.phase_budget_4.outputs.minutes || '1') }}
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.phase_budget_4.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/ci
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime

          token = os.environ.get("GITHUB_TOKEN", "")
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "1")
          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          job_name_to_need_key = {
              "Admit explicit qualification": "admission",
              "Route CI runner": "route",
              "Tokmd Rust Result": "tokmd-rust-result",
              "Detect risk packs": "detect",
              "MSRV Check": "msrv",
              "Build & Test (Windows)": "build-windows",
              "Build & Test (macOS)": "build-macos",
              "Cargo Deny": "deny",
              "Wasm Compile & Test": "wasm-compile",
              "Typos": "typos",
              "Proptest Smoke": "proptest-smoke",
              "Publish Surface": "publish-plan",
              "Version consistency": "version-consistency",
              "Docs Check": "docs-check",
              "Nix PR Package Gate": "nix-pr",
              "Mutation Testing": "mutation",
              "Feature Boundaries": "feature-boundaries",
          }

          def parse_time(value):
              if not value:
                  return None
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          timings = {}
          page = 1
          while True:
              url = (
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
                  f"/attempts/{run_attempt}/jobs?per_page=100&page={page}"
              )
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              jobs = payload.get("jobs", [])
              for job in jobs:
                  if job.get("conclusion") != "success":
                      continue
                  need_key = job_name_to_need_key.get(job.get("name"))
                  started = parse_time(job.get("started_at"))
                  completed = parse_time(job.get("completed_at"))
                  if not need_key or not started or not completed:
                      continue
                  duration_seconds = max(0.0, (completed - started).total_seconds())
                  record = {"duration_seconds": duration_seconds}
                  labels = job.get("labels") or []
                  runner = next((label for label in labels if isinstance(label, str) and label), None)
                  if runner:
                      record["runner"] = runner
                  timings[need_key] = record
              if len(jobs) < 100:
                  break
              page += 1

          with open("target/ci/timings.json", "w", encoding="utf-8") as handle:
              json.dump(timings, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(f"CI timings sidecar written with {len(timings)} job(s)")
          PY

      - name: Allocate phase 5 budget
        id: phase_budget_5
        continue-on-error: true
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Generate CI actuals receipt
        timeout-minutes: ${{ fromJSON(steps.phase_budget_5.outputs.minutes || '1') }}
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.phase_budget_5.outcome == 'success' }}
        continue-on-error: true
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          mkdir -p target/ci
          printf '%s\n' "${NEEDS_JSON}" > target/ci/needs.json
          timing_args=()
          if [ -s target/ci/timings.json ]; then
            timing_args=(--timings target/ci/timings.json)
          fi
          cargo xtask ci-actuals \
            --needs target/ci/needs.json \
            "${timing_args[@]}" \
            --output target/ci/ci-actuals.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --sha "${GITHUB_SHA}"

      - name: Allocate phase 6 budget
        id: phase_budget_6
        continue-on-error: true
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Upload CI actuals receipt
        timeout-minutes: ${{ fromJSON(steps.phase_budget_6.outputs.minutes || '1') }}
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.phase_budget_6.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-actuals
          path: |
            target/ci/needs.json
            target/ci/timings.json
            target/ci/ci-actuals.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish advisory lane summary
        shell: python3 scripts/ci_budget.py run --marker target/ci-budget/lane-summary --reserve-seconds 0 -- bash --noprofile --norc -e -o pipefail {0}
        timeout-minutes: 1
        if: ${{ always() && steps.job_budget.outcome == 'success' }}
        continue-on-error: true
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          lines = [
              "## Advisory CI lane summary",
              "",
              "Branch protection uses `Tokmd Rust Result` only (phase 2, #226).",
              "",
              "| Job | Result |",
              "| --- | --- |",
          ]

          for job, payload in sorted(needs.items()):
              result = payload.get("result", "unknown")
              lines.append(f"| `{job}` | `{result}` |")

          summary = "\n".join(lines) + "\n"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write(summary)

          print(summary)
          PY

      - name: Finalize shared qualification budget
        if: ${{ always() && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          python scripts/ci_qualification.py
          source_status=$?
          python scripts/ci_budget.py finalize --receipt target/ci-budget-finalization.json
          budget_status=$?
          cat target/ci-budget-finalization.json
          if [ "$source_status" -ne 0 ]; then exit "$source_status"; fi
          exit "$budget_status"
