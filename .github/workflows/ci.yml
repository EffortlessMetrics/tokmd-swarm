            echo "| proof-run policy | 0 |"
            echo "| proof run | ${proof_run_status} |"
            echo "| proof run artifacts | ${proof_run_artifacts_status} |"
            echo "| proof run observation | ${proof_run_observation_status} |"
            echo ""
