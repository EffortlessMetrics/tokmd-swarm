    if: needs.admission.outputs.admitted == 'true' && needs.deny.result == 'success' && (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
