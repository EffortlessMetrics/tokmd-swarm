      - name: Allocate receipt upload budget
        id: upload_budget
        continue-on-error: true
        if: ${{ always() && steps.source_checkout.outcome == 'success' }}
        run: python3 scripts/ci_budget.py allowance --reserve-seconds 0

      - name: Upload UB Review observability receipt
        if: ${{ always() && steps.upload_budget.outcome == 'success' }}
