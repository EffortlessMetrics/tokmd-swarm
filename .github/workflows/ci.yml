  # Detect which risk packs the PR diff hits. Downstream gated jobs OR
  # this output into their `if:` so the deep lanes also run when matching
  # paths change, even without an explicit label. Mirrors the routing
  # in policy/ci-risk-packs.toml.
  detect:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 360 }}
    if: needs.admission.outputs.admitted == 'true'
    needs: admission
    name: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'ci:qualify') && 'Observation - ' || '' }}Detect risk packs
    runs-on: ubuntu-latest
    outputs:
      wasm: ${{ steps.detect.outputs.wasm }}
      nix: ${{ steps.detect.outputs.nix }}
      release: ${{ steps.detect.outputs.release }}
      windows_path: ${{ steps.detect.outputs.windows_path }}
      core_receipts: ${{ steps.detect.outputs.core_receipts }}
      analysis: ${{ steps.detect.outputs.analysis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Revalidate shared qualification budget
        id: job_budget
        shell: bash
        env:
          QUALIFICATION_DEADLINE: ${{ needs.admission.outputs.deadline_epoch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ci_qualification.py

      - name: Allocate phase 2 budget
        id: phase_budget_2
        if: ${{ (github.event_name == 'pull_request') && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Fetch base ref
        timeout-minutes: ${{ fromJSON(steps.phase_budget_2.outputs.minutes || '1') }}
        if: ${{ (github.event_name == 'pull_request') && steps.phase_budget_2.outcome == 'success' }}
        run: git fetch origin "${{ github.base_ref }}":"refs/remotes/origin/${{ github.base_ref }}" || true

      - id: detect
        name: Compute risk-pack output flags
        shell: python3 scripts/ci_budget.py run --marker target/ci-budget/risk-detection --reserve-seconds 0 -- bash --noprofile --norc -e -o pipefail "{0}"
        env:
          LABELS_JSON: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.labels) || '[]' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          mkdir -p target/ci
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${PUSH_BEFORE}" ] && ! printf '%s' "${PUSH_BEFORE}" | grep -Eq '^0+$'; then
            base_ref="${PUSH_BEFORE}"
          elif [ "${{ github.event_name }}" = "push" ] && git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            base_ref="HEAD"
          fi
          cargo xtask ci-plan \
            --base "${base_ref}" \
            --head HEAD \
            --labels-json "${LABELS_JSON}" \
            --lanes policy/ci-lane-whitelist.toml \
            --risk-packs policy/ci-risk-packs.toml \
            --no-budget-annotations \
            --json-out target/ci/ci-detect-plan.json \
            --route-json-out target/ci/proof-pack-route.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Allocate phase 3 budget
        id: phase_budget_3
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify proof-pack route receipts
        timeout-minutes: ${{ fromJSON(steps.phase_budget_3.outputs.minutes || '1') }}
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.phase_budget_3.outcome == 'success' }}
        run: |
          status=0
          for receipt in target/ci/ci-detect-plan.json target/ci/proof-pack-route.json; do
            if [ ! -s "$receipt" ]; then
              echo "::error::Missing or empty proof-pack route receipt: $receipt"
              status=1
            fi
          done
          exit "$status"

      - name: Allocate phase 4 budget
        id: phase_budget_4
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Upload proof-pack route receipt
        timeout-minutes: ${{ fromJSON(steps.phase_budget_4.outputs.minutes || '1') }}
        if: ${{ ((always()) && steps.job_budget.outcome == 'success') && steps.phase_budget_4.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: proof-pack-route
          path: |
            target/ci/ci-detect-plan.json
            target/ci/proof-pack-route.json
          if-no-files-found: error
          retention-days: 14

      - name: Finalize shared qualification budget
        if: ${{ always() && steps.job_budget.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          python scripts/ci_qualification.py
          source_status=$?
          python scripts/ci_budget.py finalize --receipt target/ci-budget-finalization.json
          budget_status=$?
          cat target/ci-budget-finalization.json
          if [ "$source_status" -ne 0 ]; then exit "$source_status"; fi
          exit "$budget_status"

