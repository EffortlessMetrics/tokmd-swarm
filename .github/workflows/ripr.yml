name: ripr (advisory)

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ripr-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci:qualify' && format('qualification-{0}-{1}', github.event.pull_request.number, github.sha) || format('observation-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0
  RIPR_VERSION: "0.7.0"

jobs:
  ripr:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 360 }}
    name: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'ci:qualify') && 'Observation - ' || '' }}ripr (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Admit explicit PR qualification
        shell: bash
        id: qualification_gate
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ci_qualification.py

      - name: Allocate phase 2 budget
        id: phase_budget_2
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_2.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_2.outputs.minutes || '1') || 360 }}

      - name: Allocate phase 3 budget
        id: phase_budget_3
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - uses: Swatinem/rust-cache@v2
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_3.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_3.outputs.minutes || '1') || 360 }}
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Allocate phase 4 budget
        id: phase_budget_4
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Install ripr
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_4.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_4.outputs.minutes || '1') || 360 }}
        run: cargo install ripr --version "$RIPR_VERSION" --locked

      - name: Allocate phase 5 budget
        id: phase_budget_5
        if: ${{ github.event_name == 'pull_request' && ((github.base_ref != '') && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Fetch base branch
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_5.outputs.minutes || '1') || 360 }}
        if: ${{ (github.base_ref != '') && (github.event_name != 'pull_request' || steps.phase_budget_5.outcome == 'success') }}
        run: git fetch origin "${{ github.base_ref }}":"refs/remotes/origin/${{ github.base_ref }}" || true

      - name: Allocate phase 6 budget
        id: phase_budget_6
        if: ${{ github.event_name == 'pull_request' && ((github.event_name == 'pull_request') && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: RIPR PR evidence
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_6.outputs.minutes || '1') || 360 }}
        id: ripr_pr
        if: ${{ (github.event_name == 'pull_request') && (github.event_name != 'pull_request' || steps.phase_budget_6.outcome == 'success') }}
        run: cargo xtask ripr-pr --base "origin/${{ github.base_ref }}"

      - name: Allocate phase 7 budget
        id: phase_budget_7
        if: ${{ github.event_name == 'pull_request' && ((github.event_name == 'pull_request') && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: RIPR review guidance
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_7.outputs.minutes || '1') || 360 }}
        id: ripr_review
        if: ${{ (github.event_name == 'pull_request') && (github.event_name != 'pull_request' || steps.phase_budget_7.outcome == 'success') }}
        run: cargo xtask ripr-review-comments --base "origin/${{ github.base_ref }}" --head HEAD

      - name: Allocate phase 8 budget
        id: phase_budget_8
        if: ${{ github.event_name == 'pull_request' && ((github.event_name == 'pull_request') && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: RIPR PR contract
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_8.outputs.minutes || '1') || 360 }}
        if: ${{ (github.event_name == 'pull_request') && (github.event_name != 'pull_request' || steps.phase_budget_8.outcome == 'success') }}
        run: |
          cargo xtask ripr-pr --check
          cargo xtask ripr-review-comments --check

      - name: Allocate phase 9 budget
        id: phase_budget_9
        if: ${{ github.event_name == 'pull_request' && (((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: RIPR review summary
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_9.outputs.minutes || '1') || 360 }}
        if: ${{ ((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.phase_budget_9.outcome == 'success') }}
        shell: bash
        run: |
          {
            echo "## RIPR Review Guidance"
            echo
            if [ -f target/ripr/review/comments.md ]; then
              cat target/ripr/review/comments.md
            else
              echo "No RIPR review guidance was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Allocate phase 10 budget
        id: phase_budget_10
        if: ${{ github.event_name == 'pull_request' && (((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: RIPR annotations
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_10.outputs.minutes || '1') || 360 }}
        if: ${{ ((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.phase_budget_10.outcome == 'success') }}
        run: cargo xtask ripr-annotations

      - name: Allocate phase 11 budget
        id: phase_budget_11
        if: ${{ github.event_name == 'pull_request' && (((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Upload RIPR PR evidence
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_11.outputs.minutes || '1') || 360 }}
        if: ${{ ((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.phase_budget_11.outcome == 'success') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ripr-pr
          path: target/ripr/pr
          if-no-files-found: warn
          retention-days: 14

      - name: Allocate phase 12 budget
        id: phase_budget_12
        if: ${{ github.event_name == 'pull_request' && (((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Upload RIPR review guidance
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_12.outputs.minutes || '1') || 360 }}
        if: ${{ ((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.phase_budget_12.outcome == 'success') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ripr-review
          path: target/ripr/review
          if-no-files-found: warn
          retention-days: 14

      - name: Finalize explicit PR qualification budget
        shell: bash
        if: ${{ always() && github.event_name == 'pull_request' && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success') }}
        run: |
          set +e
          python scripts/ci_qualification.py
          source_status=$?
          python scripts/ci_budget.py finalize --receipt target/ci-budget-finalization.json
          budget_status=$?
          cat target/ci-budget-finalization.json
          if [ "$source_status" -ne 0 ]; then exit "$source_status"; fi
          exit "$budget_status"
