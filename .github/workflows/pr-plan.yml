name: PR Plan

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-plan-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci:qualify' && format('qualification-{0}-{1}', github.event.pull_request.number, github.sha) || format('observation-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  pr-plan:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 360 }}
    name: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'ci:qualify') && 'Observation - ' || '' }}PR Plan (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Admit explicit PR qualification
        shell: bash
        id: qualification_gate
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ci_qualification.py

      - name: Allocate phase 2 budget
        id: phase_budget_2
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_2.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_2.outputs.minutes || '1') || 360 }}

      - name: Allocate phase 3 budget
        id: phase_budget_3
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - uses: Swatinem/rust-cache@v2
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_3.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_3.outputs.minutes || '1') || 360 }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Allocate phase 4 budget
        id: phase_budget_4
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Fetch base ref
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_4.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_4.outputs.minutes || '1') || 360 }}
        run: git fetch origin "${{ github.base_ref }}":"refs/remotes/origin/${{ github.base_ref }}" || true

      - name: Allocate phase 5 budget
        id: phase_budget_5
        continue-on-error: true
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Download recent CI actuals cache
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_5.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_5.outputs.minutes || '1') || 360 }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/ci/actuals-cache
          count=0
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            out="target/ci/actuals-cache/${run_id}"
            mkdir -p "$out"
            if gh run download "${run_id}" --name ci-actuals --dir "$out" >/tmp/ci-actuals-download.log 2>&1; then
              if [ -s "$out/ci-actuals.json" ]; then
                count=$((count + 1))
              fi
            fi
          done < <(gh run list --workflow CI --branch main --status success --limit 5 --json databaseId --jq '.[].databaseId')
          echo "Downloaded ${count} CI actuals receipt(s) for advisory learned estimates."
          {
            echo "## CI actuals cache (advisory)"
            echo ""
            echo "Downloaded ${count} recent \`ci-actuals\` receipt(s) from successful \`main\` CI runs."
            echo "If this is zero, PR Plan falls back to static \`base_lem\` estimates."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Allocate phase 6 budget
        id: phase_budget_6
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Generate PR plan
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_6.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_6.outputs.minutes || '1') || 360 }}
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          mkdir -p target/ci
          actuals_args=()
          if [ -d target/ci/actuals-cache ] && find target/ci/actuals-cache -name '*.json' -print -quit | grep -q .; then
            actuals_args=(--actuals-dir target/ci/actuals-cache)
          fi
          cargo xtask ci-plan \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --labels-json "$LABELS_JSON" \
            --lanes policy/ci-lane-whitelist.toml \
            --risk-packs policy/ci-risk-packs.toml \
            "${actuals_args[@]}" \
            --json-out target/ci/ci-plan.json \
            --route-json-out target/ci/proof-pack-route.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --enforce

      - name: Allocate phase 7 budget
        id: phase_budget_7
        if: ${{ github.event_name == 'pull_request' && (((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Verify PR plan receipts
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_7.outputs.minutes || '1') || 360 }}
        if: ${{ ((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.phase_budget_7.outcome == 'success') }}
        run: |
          status=0
          for receipt in target/ci/ci-plan.json target/ci/proof-pack-route.json; do
            if [ ! -s "$receipt" ]; then
              echo "::error::Missing or empty PR plan receipt: $receipt"
              status=1
            fi
          done
          exit "$status"

      - name: Allocate phase 8 budget
        id: phase_budget_8
        if: ${{ github.event_name == 'pull_request' && (((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Upload PR plan receipts
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_8.outputs.minutes || '1') || 360 }}
        if: ${{ ((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.phase_budget_8.outcome == 'success') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-plan
          path: |
            target/ci/ci-plan.json
            target/ci/proof-pack-route.json
          if-no-files-found: error
          retention-days: 7

      - name: Finalize explicit PR qualification budget
        shell: bash
        if: ${{ always() && github.event_name == 'pull_request' && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success') }}
        run: |
          set +e
          python scripts/ci_qualification.py
          source_status=$?
          python scripts/ci_budget.py finalize --receipt target/ci-budget-finalization.json
          budget_status=$?
          cat target/ci-budget-finalization.json
          if [ "$source_status" -ne 0 ]; then exit "$source_status"; fi
          exit "$budget_status"
