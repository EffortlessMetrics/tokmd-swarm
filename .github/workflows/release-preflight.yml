name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact committed source SHA to prove (40 or 64 hex characters)
        required: true
        type: string
      affected_base_sha:
        description: Exact immutable base SHA for affected planning
        required: true
        type: string
      expected_version:
        description: Exact workspace version expected by the preflight
        required: true
        type: string
      release_kind:
        description: Release boundary being proven
        required: true
        type: choice
        options:
          - rc
          - stable
  workflow_call:
    inputs:
      source_sha:
        description: Exact committed source SHA to prove
        required: true
        type: string
      affected_base_sha:
        description: Exact immutable base SHA for affected planning
        required: true
        type: string
      expected_version:
        description: Exact workspace version expected by the preflight
        required: true
        type: string
      release_kind:
        description: Release boundary being proven
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ inputs.source_sha }}-${{ inputs.release_kind }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0
  SOURCE_SHA: ${{ inputs.source_sha }}
  AFFECTED_BASE_SHA: ${{ inputs.affected_base_sha }}
  EXPECTED_VERSION: ${{ inputs.expected_version }}
  RELEASE_KIND: ${{ inputs.release_kind }}
  PREFLIGHT_ROOT: target/release-preflight

jobs:
  preflight:
    name: Exact-source release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source and affected base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PREFLIGHT_ROOT}/logs"
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$|^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::source_sha must be a 40- or 64-character hexadecimal SHA"
            exit 1
          fi
          if [[ ! "${AFFECTED_BASE_SHA}" =~ ^[0-9a-fA-F]{40}$|^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::affected_base_sha must be a 40- or 64-character hexadecimal SHA"
            exit 1
          fi
          actual_source="$(git rev-parse HEAD^{commit})"
          requested_source="$(git rev-parse "${SOURCE_SHA}^{commit}")"
          test "${actual_source}" = "${requested_source}"
          git fetch --no-tags origin "${AFFECTED_BASE_SHA}"
          git cat-file -e "${AFFECTED_BASE_SHA}^{commit}"
          {
            echo "source_sha=${requested_source}"
            echo "affected_base_sha=${AFFECTED_BASE_SHA}"
            echo "expected_version=${EXPECTED_VERSION}"
            echo "release_kind=${RELEASE_KIND}"
          } | tee "${PREFLIGHT_ROOT}/identity.txt"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install wasm-pack
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: wasm-pack

      - name: Install cargo-deny
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-deny@0.19.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target/release-preflight-cache
          cache-directories: target/release-preflight-cache

      - name: Run required commands and record terminal observations
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          root="${PREFLIGHT_ROOT}"
          logs="${root}/logs"
          mkdir -p "${logs}"
          : > "${root}/commands.jsonl"

          run_command() {
            local id="$1"
            local command="$2"
            local log_path="${logs}/${id}.log"
            local started ended duration exit_code status detail
            started="$(date +%s%3N)"
            set +e
            timeout --signal=TERM --kill-after=30s 45m bash -o pipefail -c "${command}" >"${log_path}" 2>&1
            exit_code=$?
            set -e
            ended="$(date +%s%3N)"
            duration=$((ended - started))
            if [[ "${exit_code}" -eq 0 ]]; then
              status=passed
              detail="command completed successfully"
            elif [[ "${exit_code}" -eq 124 || "${exit_code}" -eq 137 ]]; then
              status=unavailable
              detail="command exceeded the 45 minute bounded timeout"
            elif [[ "${exit_code}" -eq 130 || "${exit_code}" -eq 143 ]]; then
              status=cancelled
              detail="command was interrupted or cancelled"
            else
              status=failed
              detail="command exited with ${exit_code}"
            fi
            jq -cn \
              --arg id "${id}" \
              --arg status "${status}" \
              --arg log "${log_path#${root}/}" \
              --arg detail "${detail}" \
              --argjson duration_ms "${duration}" \
              '{id:$id,status:$status,duration_ms:$duration_ms,log:$log,detail:$detail}' \
              >> "${root}/commands.jsonl"
            echo "${id}: ${status} (${duration}ms)"
          }

          run_command affected_plan \
            'cargo xtask affected --base "${AFFECTED_BASE_SHA}" --head "${SOURCE_SHA}" --json-output "${PREFLIGHT_ROOT}/affected.json" && jq -e ".unknown_files | length == 0" "${PREFLIGHT_ROOT}/affected.json"'
          run_command proof_plan \
            'cargo xtask proof --profile affected --base "${AFFECTED_BASE_SHA}" --head "${SOURCE_SHA}" --plan --plan-json "${PREFLIGHT_ROOT}/proof-plan.json" --evidence-json "${PREFLIGHT_ROOT}/proof-evidence.json"'
          run_command fmt_check 'cargo fmt-check'
          run_command gate_check 'cargo gate-check'
          run_command version_consistency \
            'cargo xtask version-consistency && test "$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"tokmd\") | .version" | head -n 1)" = "${EXPECTED_VERSION}"'
          run_command publish_surface \
            'cargo xtask publish-surface --json --verify-publish | tee "${PREFLIGHT_ROOT}/publish-surface.json"'
          run_command doc_artifacts 'cargo xtask doc-artifacts --check --json "${PREFLIGHT_ROOT}/doc-artifacts.json"'
          run_command docs_check 'cargo xtask docs --check'
          run_command proof_policy 'cargo xtask proof-policy --check'
          run_command no_panic 'cargo xtask check-no-panic-family --strict'
          run_command workspace_tests 'cargo test --workspace --all-features'
          run_command clippy 'cargo clippy --workspace --all-targets --all-features -- -D warnings'
          run_command cargo_deny 'cargo deny --all-features check'
          run_command publish_dry_run 'cargo xtask publish --dry-run'
          run_command browser_tests 'npm --prefix web/runner test'
          run_command browser_wasm_archive 'npm --prefix web/runner run build:wasm:archive-zip'

          jq -s '{schema:"tokmd.release_preflight_input.v2",schema_version:1,source_sha:env.SOURCE_SHA,affected_base_sha:env.AFFECTED_BASE_SHA,expected_version:env.EXPECTED_VERSION,release_kind:env.RELEASE_KIND,commands:.}' \
            "${root}/commands.jsonl" > "${root}/input.json"

      - name: Aggregate terminal release-preflight receipt
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "${PREFLIGHT_ROOT}"
          if [[ -f "${PREFLIGHT_ROOT}/input.json" ]]; then
            cargo xtask release-preflight \
              --input "${PREFLIGHT_ROOT}/input.json" \
              --output "${PREFLIGHT_ROOT}/receipt.json"
            aggregate_exit=$?
          else
            aggregate_exit=1
            echo "release-preflight input was not produced" > "${PREFLIGHT_ROOT}/aggregate.log"
          fi
          echo "aggregate_exit=${aggregate_exit}" >> "${PREFLIGHT_ROOT}/aggregate.log"
          exit 0

      - name: Write preflight summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Release preflight"
            echo "- source_sha: ${SOURCE_SHA}"
            echo "- affected_base_sha: ${AFFECTED_BASE_SHA}"
            echo "- expected_version: ${EXPECTED_VERSION}"
            echo "- release_kind: ${RELEASE_KIND}"
            if [[ -f "${PREFLIGHT_ROOT}/receipt.json" ]]; then
              echo "- overall: $(jq -r '.overall' "${PREFLIGHT_ROOT}/receipt.json")"
            else
              echo "- overall: unavailable (receipt was not produced)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload terminal release-preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-preflight-${{ inputs.source_sha }}
          path: target/release-preflight/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce terminal release-preflight decision
        if: always()
        shell: bash
        run: |
          if [[ ! -f "${PREFLIGHT_ROOT}/receipt.json" ]]; then
            echo "::error::terminal release-preflight receipt is missing"
            exit 1
          fi
          test "$(jq -r '.overall' "${PREFLIGHT_ROOT}/receipt.json")" = passed
