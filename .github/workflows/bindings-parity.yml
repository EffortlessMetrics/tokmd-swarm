name: Bindings Parity

on:
  push:
    branches: ["main"]
    paths:
      - "crates/tokmd-core/**"
      - "crates/tokmd-python/**"
      - "crates/tokmd-node/**"
      - "crates/tokmd-envelope/**"
      - "fixtures/bindings-parity/**"
      - "xtask/src/tasks/bindings_parity.rs"
      - "xtask/src/cli.rs"
      - "xtask/src/main.rs"
      - "xtask/src/tasks/mod.rs"
      - "docs/specs/bindings-parity.md"
      - ".github/workflows/bindings-parity.yml"
      - ".github/agents/bindings-parity-keeper.agent.md"

permissions:
  contents: read

concurrency:
  group: bindings-parity-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci:qualify' && format('qualification-{0}-{1}', github.event.pull_request.number, github.sha) || format('observation-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: false
  queue: max

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -C debuginfo=0

jobs:
  bindings-parity:
    name: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name != 'ci:qualify') && 'Observation - ' || '' }}Bindings Parity (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Admit explicit PR qualification
        shell: bash
        id: qualification_gate
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ci_qualification.py

      - name: Allocate phase 2 budget
        id: phase_budget_2
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_2.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_2.outputs.minutes || '1') || 360 }}

      - name: Allocate phase 3 budget
        id: phase_budget_3
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - uses: Swatinem/rust-cache@v2
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_3.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_3.outputs.minutes || '1') || 360 }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Allocate phase 4 budget
        id: phase_budget_4
        if: ${{ github.event_name == 'pull_request' && ((github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Run bindings parity checker (advisory)
        if: ${{ (github.event_name != 'pull_request' || steps.phase_budget_4.outcome == 'success') }}
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_4.outputs.minutes || '1') || 360 }}
        run: |
          set +e
          mkdir -p target/tokmd/reports
          cargo xtask bindings-parity --check \
            --receipt target/tokmd/reports/bindings-parity-report.json \
            2> target/tokmd/reports/bindings-parity-stderr.txt
          status=$?

          {
            echo "## Bindings parity"
            echo ""
            echo "Agent charter: [.github/agents/bindings-parity-keeper.agent.md](.github/agents/bindings-parity-keeper.agent.md)"
            echo "Spec: [docs/specs/bindings-parity.md](docs/specs/bindings-parity.md)"
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "Advisory check completed."
            else
              echo "Advisory check exited with status $status."
            fi
            echo ""
            echo '```'
            cat target/tokmd/reports/bindings-parity-stderr.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Allocate phase 5 budget
        id: phase_budget_5
        if: ${{ github.event_name == 'pull_request' && (((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) }}
        shell: bash
        run: python scripts/ci_budget.py allowance --reserve-seconds 0 --max-minutes 20

      - name: Upload bindings parity report
        timeout-minutes: ${{ github.event_name == 'pull_request' && fromJSON(steps.phase_budget_5.outputs.minutes || '1') || 360 }}
        if: ${{ ((always()) && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success')) && (github.event_name != 'pull_request' || steps.phase_budget_5.outcome == 'success') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bindings-parity-report
          path: target/tokmd/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Finalize explicit PR qualification budget
        shell: bash
        if: ${{ always() && github.event_name == 'pull_request' && (github.event_name != 'pull_request' || steps.qualification_gate.outcome == 'success') }}
        run: |
          set +e
          python scripts/ci_qualification.py
          source_status=$?
          python scripts/ci_budget.py finalize --receipt target/ci-budget-finalization.json
          budget_status=$?
          cat target/ci-budget-finalization.json
          if [ "$source_status" -ne 0 ]; then exit "$source_status"; fi
          exit "$budget_status"
