# Transitional source/command inventory for issue #604.
#
# This is an adoption guard, not a replacement for depguard#22/#24.  The
# inventory is deliberately closed: every candidate root has an explicit
# classification, and a new candidate root must be added here before it can be
# treated as a known surface.
schema_version = 1
inventory = "closed-world"
claim = "Transitional adoption guard: detect unlocked Cargo guidance on adopted live surfaces and classify deferred, historical, and dynamically assembled surfaces without executing commands."
non_goal = "This inventory does not replace depguard scanning, prove release readiness, or interpret shell programs."

candidate_roots = [
    "AGENTS.md",
    "agents",
    ".cargo",
    ".claude",
    ".codex",
    ".factory",
    ".githooks",
    ".github",
    ".jules",
    ".tokmd-spec",
    ".vscode",
    "badges",
    "README.md",
    "CONTRIBUTING.md",
    "ARCHITECTURE.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "CODE_OF_CONDUCT.md",
    "RELEASE.md",
    "SECURITY.md",
    "CLAUDE.md",
    "GEMINI.md",
    "tokmd-role.md",
    "docs",
    ".github/workflows",
    "Dockerfile",
    "Dockerfile.release",
    "flake.nix",
    "scripts",
    "xtask",
    "xtask/src",
    "crates",
    "Cargo.toml",
    "Cargo.lock",
    "Justfile",
    "action.yml",
    "ci",
    "contracts",
    "deny.toml",
    "fixtures",
    "fuzz",
    "plans",
    "PR_DRAIN.md",
    "proptest.toml",
    "ripr.toml",
    "ROADMAP.md",
    "TODO.md",
    "vendor",
    "web",
    "policy",
    "_typos.toml",
    ".dockerignore",
    ".editorconfig",
    ".gitattributes",
    ".gitignore",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

# Longest matching path wins.  A directory classification applies recursively.
# Live guidance is intentionally limited to the canonical surfaces repaired by
# #605; the remaining roots are visible adoption boundaries for follow-up work.
[[surface]]
path = "AGENTS.md"
mode = "live"
reason = "canonical agent guidance"

[[surface]]
path = "agents/shared/repo.md"
mode = "live"
reason = "canonical mirrored repository guidance"

[[surface]]
path = "agents"
mode = "deferred"
reason = "role-specific copies are a follow-up inventory"

[[surface]]
path = ".factory"
mode = "deferred"
reason = "review and security support artifacts are outside this adoption slice"

[[surface]]
path = ".factory/security/reports"
mode = "historical"
reason = "security reports preserve incident-era command text"

[[surface]]
path = "docs/examples"
mode = "historical"
reason = "examples may preserve historical command output"

[[surface]]
path = "xtask/src"
mode = "dynamic"
reason = "Rust-spawned commands require semantic ownership review"

[[surface]]
path = "xtask"
mode = "deferred"
reason = "xtask control-plane ownership is a separate follow-up slice"

[[surface]]
path = ".cargo"
mode = "deferred"
reason = "Cargo configuration is a separate dependency and tooling slice"

[[surface]]
path = ".claude"
mode = "deferred"
reason = "adapter tooling guidance is outside this adoption slice"

